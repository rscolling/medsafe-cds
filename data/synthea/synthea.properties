# Optional: generate REAL Synthea patients (https://github.com/synthetichealth/synthea, Apache-2.0)
# and load them into HAPI. Tests and the demo do NOT need this; a seeded Synthea-style cohort is
# generated in-process (backend/app/cohort.py) instead.
#
#   git clone https://github.com/synthetichealth/synthea && cd synthea
#   ./run_synthea -p 200 -s 42 -a 30-90 --config data/synthea/synthea.properties Massachusetts
#   python scripts/load_data.py --fhir-base http://localhost:8090/fhir --synthea-dir synthea/output/fhir
exporter.fhir.export = true
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
exporter.fhir.transaction_bundle = true
exporter.years_of_history = 2
generate.default_population = 200
