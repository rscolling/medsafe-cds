[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medsafe-cds"
version = "0.1.0"
description = "Prototype CDS Hooks service: one rules engine, two data sources (FHIR R4 and VistA). Not clinical advice."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pip-audit>=2.7",
  "bandit>=1.7",
]

[tool.pytest.ini_options]
pythonpath = [".", "third_party"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  # Third-party notice about the TestClient transport; not actionable in this repo.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
  "integration: needs external containers (HAPI FHIR and/or VEHU VistA); skipped when unavailable",
  "hapi: needs a local HAPI FHIR server",
  "vista_live: needs a live VEHU RPC Broker on port 9430",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PT"]
ignore = ["S101", "PT018", "E501"]  # E501: long prose strings are fine; ruff format wraps code

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "third_party"
plugins = ["pydantic.mypy"]
exclude = ["third_party/"]

[[tool.mypy.overrides]]
module = "vista_clients.*"
follow_imports = "skip"
ignore_missing_imports = true

[tool.setuptools]
packages = ["app", "app.api", "app.rules", "app.adapters", "app.adapters.fhir", "app.adapters.vista",
            "app.mapping", "app.audit", "app.clinical", "vista_clients", "vista_clients.rpc"]

[tool.setuptools.package-dir]
app = "app"
vista_clients = "third_party/vista_clients"

[tool.bandit]
exclude_dirs = ["tests", "third_party"]
